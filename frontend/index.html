<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#163B65" />
    <meta
      name="description"
      content="Hirgal project management and team collaboration platform."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/src/assets/brand/hirgal-favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/brand/hirgal-favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/src/assets/brand/hirgal-favicon-48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/src/assets/brand/hirgal-apple-touch-icon.png"
    />
    <title>Hirgal | Workspace</title>
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const preference = localStorage.getItem('hirgal-theme');
          const dark =
            preference === 'dark' ||
            (preference !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          const systemDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', systemDark);
          root.style.colorScheme = systemDark ? 'dark' : 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
